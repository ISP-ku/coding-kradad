name: CI

on:
  push:
    branches: [main, ci]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r source/requirements-dev.txt

      - name: Check Python files compile
        run: python -m py_compile source/*.py

      - name: Import Flask apps
        working-directory: source
        run: |
          python -c "import app"
          python -c "import test_ui"

      - name: Run backend unit tests
        working-directory: source
        run: pytest -v
