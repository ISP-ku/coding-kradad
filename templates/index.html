<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Course Dashboard Login</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #313338;
            color: #f2f3f5;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background: #2b2d31;
            padding: 40px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        .login-btn {
            display: block;
            margin-top: 12px;
            padding: 12px 24px;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
        }
        .discord-btn { background: #5865F2; }
        .discord-btn:hover { background: #4752c4; }
        .google-btn { background: #ffffff; color: #1f1f1f; }
        .google-btn:hover { background: #e8e8e8; }
        .line-btn { background: #06C755; }
        .line-btn:hover { background: #05a648; }
        .discord-btn.action { display: inline-block; }
        .user-box img {
            border-radius: 50%;
            width: 64px;
            height: 64px;
        }
        a.secondary { color: #b5bac1; }
    </style>
</head>
<body>
    <div class="card">
        {% if user %}
            <div class="user-box">
                {% if user.avatar_url %}
                    <img src="{{ user.avatar_url }}" alt="avatar">
                {% endif %}
                <h2>Welcome, {{ user.username }}</h2>
                <p><small>via {{ user.provider|capitalize }}</small></p>
                <p><a class="discord-btn login-btn action" href="{{ url_for('dashboard') }}">Go to Dashboard</a></p>
                <p><a class="secondary" href="{{ url_for('logout') }}">Log out</a></p>
            </div>
        {% else %}
            <h1>My Course Dashboard</h1>
            <p>Sign in to continue</p>
            <a class="login-btn discord-btn" href="{{ url_for('login', provider='discord') }}">Login with Discord</a>
            <a class="login-btn google-btn" href="{{ url_for('login', provider='google') }}">Login with Google (Classroom)</a>
            <a class="login-btn line-btn" href="{{ url_for('login', provider='line') }}">Login with LINE</a>
        {% endif %}
    </div>
</body>
</html>
