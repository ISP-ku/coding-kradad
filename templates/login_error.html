<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Sign-in problem</title>
<style>body{font:16px/1.5 system-ui;background:#f7f6fa;color:#343449;margin:0;padding:32px}main{max-width:480px;margin:8vh auto;background:white;padding:32px;border-radius:16px}h1{font-size:22px;margin:0 0 12px}.error{background:#fdecec;color:#8a1f1f;padding:12px 14px;border-radius:8px}a{display:inline-block;margin-top:16px;color:white;background:#7355cf;padding:10px 18px;border-radius:8px;text-decoration:none}</style></head>
<body><main><h1>We could not sign you in</h1>
<p class="error" role="alert">{{ message }}</p>
<a href="{{ login_url }}">Back to sign in</a></main></body></html>
